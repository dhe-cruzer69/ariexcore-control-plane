# ARIEXCORE autonomy levels
default: 0
levels:
  0:
    name: Observe
    allow: [read, inspect, report]
  1:
    name: Assist
    allow: [read, plan, patch, open_pr]
  2:
    name: Governed Autopilot
    allow: [execute, autofix_trivial]
    requires: [evidence_validated, hard_limits]
  3:
    name: Never
    allow: []
    gate: x4-approval
