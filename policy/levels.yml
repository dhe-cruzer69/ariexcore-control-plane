default: 0
levels:
  0: { name: Observe, actions: [read, inspect, report] }
  1: { name: Assist, actions: [read, plan, patch, open_pr] }
  2: { name: Governed Autopilot, actions: [execute, verify, recover, trivial_autofix] }
  3: { name: Never, actions: [] }
hard_stops: [delete_repository, modify_secrets, force_push_main, change_visibility, merge_without_review]
